name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '10', testbench: '8', php: '8.1' }
          - { laravel: '11', testbench: '9', php: '8.2' }
          - { laravel: '12', testbench: '10', php: '8.2' }
          - { laravel: '13', testbench: '11', php: '8.3' }
          - { laravel: '13', testbench: '11', php: '8.5' }
    env:
      # Laravel 10/11 sind EOL mit offenen Advisories, Composer würde sie sonst nicht installieren.
      COMPOSER_NO_SECURITY_BLOCKING: 1
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - if: matrix.php == '8.5'
        run: vendor/bin/pint --test && vendor/bin/phpstan analyse --no-progress
